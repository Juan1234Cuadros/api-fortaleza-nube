name: DevSecOps Pipeline - API Fortaleza Nube

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: api-fortaleza-nube

jobs:

  # ---------- Fase 2, paso 2: Auditoría de dependencias ----------
  dependency-audit:
    name: Auditoría de dependencias (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar npm audit
        # Falla el job si hay vulnerabilidades de severidad alta o crítica
        run: npm audit --audit-level=high

  # ---------- Fase 2, paso 3: Escaneo de la imagen con Trivy ----------
  image-scan:
    name: Build + escaneo de imagen (Trivy)
    needs: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'   # <- si encuentra CVEs de esa severidad, rompe el pipeline

  # ---------- Fase 2, paso 4: Despliegue automático a EC2 ----------
  deploy:
    name: Despliegue a EC2 vía SSH
    needs: [dependency-audit, image-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Desplegar en la instancia EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/api-fortaleza-nube
            git pull origin main
            docker compose build api
            docker compose up -d api
            docker image prune -f
