version: "3.8"

services:

  api:
    build: .
    image: api-fortaleza-nube:latest
    container_name: api-node
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - app-network

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3001:3001"
    networks:
      - app-network

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  uptime-kuma-data:
